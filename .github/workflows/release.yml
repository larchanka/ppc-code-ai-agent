name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Package and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build standalone agent
        run: perl build.pl

      - name: Verify build sync
        run: perl build.pl --check

      - name: Run test suite
        run: prove -I. t/*.t

      - name: Create release distribution archive
        run: |
          DIST_NAME="ppc-code-ai-agent-${{ github.ref_name }}"
          mkdir -p "$DIST_NAME"
          cp -r Install.command modern-install.command build.pl src/ code-agent.pl curl cacert.pem README.txt LICENSE "$DIST_NAME/"
          chmod +x "$DIST_NAME/Install.command" "$DIST_NAME/modern-install.command" "$DIST_NAME/curl" "$DIST_NAME/code-agent.pl"
          zip -r "${DIST_NAME}.zip" "$DIST_NAME"
          tar -czvf "${DIST_NAME}.tar.gz" "$DIST_NAME"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ppc-code-ai-agent-*.zip
            ppc-code-ai-agent-*.tar.gz
          generate_release_notes: true
