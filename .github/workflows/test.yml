name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  static-compatibility:
    name: Perl 5.8.6 Static Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Perl::MinimumVersion
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libperl-minimumversion-perl

      - name: Add scripts to PATH
        run: echo "$GITHUB_WORKSPACE/scripts" >> $GITHUB_PATH

      - name: Build code-agent.pl
        run: perl build.pl

      - name: Verify build sync
        run: perl build.pl --check

      - name: Check Perl 5.8.6 Compatibility (Perl::MinimumVersion)
        run: perl scripts/check_minimum_version.pl --perl 5.008006 --blame code-agent.pl build.pl scripts/check_minimum_version.pl src/*.pl

      - name: Run test suite with Perl::MinimumVersion
        run: prove -I. t/*.t

  test:
    name: Test (Perl ${{ matrix.perl-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        perl-version:
          - '5.8'
          - 'system'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Perl ${{ matrix.perl-version }}
        if: matrix.perl-version != 'system'
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl-version }}

      - name: Display Perl version
        run: perl -v

      - name: Build code-agent.pl
        run: perl build.pl

      - name: Verify build sync
        run: perl build.pl --check

      - name: Run test suite
        run: prove -I. t/*.t
